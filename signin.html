<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Foodie</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="signin-page">
      <div class="signin-box">
        <a href="index.html" class="logo">Foodie.</a>

        <h2>Welcome Back!</h2>

        <p>Sign in to continue ordering your favorite food.</p>

        <form id="signinForm">
          <div class="input-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="input-group">
            <label for="password">Password</label>

            <div class="password-box">
              <input
                type="password"
                id="signinpassword"
                placeholder="Enter your password"
                required
              />

              <i class="fa-solid fa-eye" id="signintogglePassword"></i>
            </div>
          </div>

          <button type="submit" class="btn signin-btn">Sign In</button>
        </form>

        <p class="signup-text">
          Don't have an account?
          <a href="signup.html">Create Account</a>
        </p>

        <a href="index.html" class="back-home">
          <i class="fa-solid fa-arrow-left"></i>
          Back to Home
        </a>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
